name: build and push worker images

# Builds every worker image in GitHub's runners and pushes to GHCR, so no local Docker is
# needed and Runpod's own 30-minute build cap never applies. Each worker is a separate
# image so a dependency conflict in one cannot break the others.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false          # one broken worker must not cancel the rest
      matrix:
        include:
          - context: .
            image: runpod-diffusers-worker
          - context: tts
            image: runpod-tts-worker
          - context: stt
            image: runpod-stt-worker
          - context: utility
            image: runpod-utility-worker
          - context: music
            image: runpod-music-worker
          - context: relight
            image: runpod-relight-worker
          - context: upscale
            image: runpod-upscale-worker
          - context: video
            image: runpod-video-worker
          # Wan 2.2 S2V: speech-to-video. Consumes a voice track (from voice-qwen) and a
          # reference image, returns a lip-synced performance. ComfyUI-based because no
          # WanSpeechToVideoPipeline exists in any diffusers release.
          - context: vid-wan-s2v
            image: runpod-wan-s2v-worker
          - context: vid-wan-a14b
            image: runpod-wan-a14b-worker
          - context: vid-hunyuan-i2v
            image: runpod-hunyuan-i2v-worker
          - context: comfy
            image: runpod-comfy-worker
          # Studio video worker: the comfy base moved to ComfyUI v0.35.0 for LTX-2.5 and
          # MiniMax H3. No weights baked -- they come from the studio network volume.
          - context: comfy-studio
            image: runpod-comfy-studio-worker
          # 3D lane. TRELLIS.2 + MoGe-2 + BiRefNet, ~9.6GB of weights on top of the
          # worker-comfyui base -- the largest image in this matrix, which is why the
          # disk-reclaim step above is load-bearing for it specifically.
          # Hunyuan3D 2.1 is deliberately absent: it is licence-quarantined in
          # threed/hunyuan/ and built by hand, never pushed on a commit to main.
          - context: threed
            image: runpod-threed-worker
          # Voice lanes. voice-qwen is the production default (Qwen3-TTS, apache-2.0,
          # first-class French); voice-comfy carries VibeVoice for long-form multi-speaker
          # plus Kokoro for English bulk; voice-bench is the 19-engine shootout rig and is
          # not a production lane. See stack-docs/VOICE-CATALOGUE.md.
          - context: voice-qwen
            image: runpod-voice-qwen-worker
          - context: voice-comfy
            image: runpod-voice-comfy-worker
          - context: voice-bench
            image: runpod-voice-bench-worker
          # TIER 2 CALIBRATION ONLY -- non-commercial weights, never published.
          # The image name carries the tier so it cannot be pulled into a production
          # lane by someone skimming the registry.
          - context: tier2-voice
            image: runpod-tier2-voice-worker
    steps:
      - uses: actions/checkout@v4

      # The runpod/pytorch base is ~20GB and a stock runner leaves under 14GB free, so the
      # build dies mid-pull with no step marked failed. Reclaiming the preinstalled
      # toolchains buys ~30GB and costs about a minute.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Lowercase literal: the org is "Aspireco" but Docker registry paths must be
          # lowercase, and github.repository_owner preserves the capital A.
          # amd64 forced: Runpod hosts are amd64 and an arm64 image dies on exec.
          platforms: linux/amd64
          # HF_TOKEN as a BuildKit SECRET, deliberately NOT a build-arg. A build-arg is
          # recorded in the image layer history, so anyone who pulls the image could read
          # the token back out. A secret mount exists only for the RUN that asks for it and
          # never lands in a layer.
          #
          # Why it exists: every weight-baking lane was pulling from HuggingFace
          # ANONYMOUSLY, at the lowest rate limit offered, from pooled GitHub runner IPs,
          # with a dozen lanes building concurrently. That produced repeated HTTP 429
          # failures -- voice-comfy failed three times on it while voice-qwen pulled 4.52GB
          # in the same minute, which is the signature of a shared limiter, not a bad URL.
          #
          # Lanes opt in per RUN:
          #   RUN --mount=type=secret,id=hf_token \
          #       HF_TOKEN="$(cat /run/secrets/hf_token 2>/dev/null)" comfy model download ...
          # A lane that does not mount it still builds, just unauthenticated.
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          push: true
          tags: |
            ghcr.io/aspireco/${{ matrix.image }}:latest
            ghcr.io/aspireco/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
