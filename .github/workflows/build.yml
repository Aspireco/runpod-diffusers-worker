name: build and push worker image

# Builds the serverless image in GitHub's runners and pushes it to GHCR, so no local
# Docker is needed and Runpod's own 30-minute build cap never applies.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The runpod/pytorch base is ~20GB and a stock runner leaves under 14GB free, so the
      # build dies mid-pull with no step marked failed. Reclaiming the preinstalled
      # toolchains buys ~30GB and costs about a minute.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Runpod hosts are amd64; a runner default of arm64 would produce an image that
          # allocates and then dies with an exec-format error.
          platforms: linux/amd64
          push: true
          # Lowercase literal: the org is "Aspireco" but Docker registry paths must be
          # lowercase, and ${{ github.repository_owner }} preserves the capital A.
          tags: |
            ghcr.io/aspireco/runpod-diffusers-worker:latest
            ghcr.io/aspireco/runpod-diffusers-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
